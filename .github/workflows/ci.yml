# CI for the G5 toolkit repo. Needs no game, ROM or secret.
# Cost note: private-repo Actions use the account's free monthly minutes (2,000 on GitHub Free). With the default
# spending limit of 0 USD, runs stop at the quota rather than bill. Each run here takes about 1-3 minutes.
name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Leak check (hash list and signatures; the ROM byte search runs on Ryzen only)
        run: python3 tools/leakcheck.py --hashes tools/leak-hashes.txt --allow tools/leak-allow.txt .
      - name: Python and C unit tests (synthetic 68000, no game data)
        run: python3 -m unittest discover -s tests/synthetic -v
      - name: Rust tests (when the crate exists)
        run: |
          if [ -f rust/Cargo.toml ]; then
            cd rust && cargo fmt --check && cargo clippy --all-targets -- -D warnings && cargo test --all-targets
          else
            echo "no rust/Cargo.toml yet"
          fi
      - name: Rust play runtime (M7; its own workspace so the boot binary's lock stays free of SDL2)
        # The sdl2 crate builds SDL2 from source with cmake (bundled, static-link). The two variables are the settings
        # Ryzen measured for cmake 4 and gcc 15 (docs/G5-PLAYABLE.md); harmless on older tools. Tests use SDL's dummy
        # video and audio drivers, so no display or sound device is needed.
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
          CFLAGS: -std=gnu17
        run: |
          cd rust/amigo_g5_play && cargo fmt --check && cargo clippy --all-targets -- -D warnings && cargo test --all-targets
      - name: Rust play runtime cross checks (M9; Windows exe and Android libmain.so)
        # cargo check only: linking needs mingw and the Android NDK, which Ryzen has (docs/G5-PLAYABLE.md). Windows is
        # checked without the desktop feature because its build script would build SDL2 from source with a mingw
        # compiler; the code checked is the same, only the SDL2 link differs. Android never builds SDL2 (it links the
        # prebuilt libSDL2.so the APK carries).
        run: |
          rustup target add aarch64-linux-android x86_64-pc-windows-gnu
          cd rust/amigo_g5_play
          cargo fmt --all --check
          cargo clippy --target aarch64-linux-android -p amigo_g5_android -- -D warnings
          cargo clippy --target x86_64-pc-windows-gnu --no-default-features --bin amigo-g5-play -- -D warnings
