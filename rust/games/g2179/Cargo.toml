[package]
name = "g2179"
version = "0.1.0"
edition = "2021"
description = "Ami-Go native: game 2179, The Great Giana Sisters, rewritten natively on native_engine from its recovered code (native batch 1)"
publish = false
workspace = "../../native_engine"
build = "build.rs"

[[bin]]
name = "g2179"
path = "src/main.rs"
required-features = ["sdl"]

[dependencies]
native_engine = { path = "../../native_engine", default-features = false }
serde_json = "1"

[features]
default = ["desktop"]
sdl = ["native_engine/sdl"]
desktop = ["sdl", "native_engine/desktop"]
