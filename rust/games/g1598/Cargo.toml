[package]
name = "g1598"
version = "0.1.0"
edition = "2021"
description = "Ami-Go native: game 1598, PGA Tour Golf, rewritten natively on native_engine from its recovered code (batch 2)"
publish = false
workspace = "../../native_engine"
build = "build.rs"

[[bin]]
name = "g1598"
path = "src/main.rs"
required-features = ["sdl"]

[dependencies]
native_engine = { path = "../../native_engine", default-features = false }
serde_json = "1"
fontdue = "0.9"

[features]
default = ["desktop"]
sdl = ["native_engine/sdl"]
desktop = ["sdl", "native_engine/desktop"]
