[package]
name = "g2055"
version = "0.1.0"
edition = "2021"
description = "Ami-Go native: game 2055, Speedball 2 - Brutal Deluxe, rewritten natively on native_engine from its recovered code (batch 1)"
publish = false
workspace = "../../native_engine"
build = "build.rs"

[[bin]]
name = "g2055"
path = "src/main.rs"
required-features = ["sdl"]

[dependencies]
native_engine = { path = "../../native_engine", default-features = false }
serde_json = "1"

[features]
default = ["desktop"]
sdl = ["native_engine/sdl"]
desktop = ["sdl", "native_engine/desktop"]
